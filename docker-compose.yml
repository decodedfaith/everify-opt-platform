services:
  postgres:
    image: postgres:16-alpine
    container_name: everify-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: everify_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./sql/002_seed_sample.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d everify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
